<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>404 - Route Not Found</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f3f4f6;
            color: #333;
            text-align: center;
            padding: 50px;
        }
        .container {
            background: white;
            border-radius: 8px;
            padding: 30px;
            max-width: 600px;
            margin: auto;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        code {
            background: #eee;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404 - Not Found</h1>
        <p>The requested URL <code>{{ .url }}</code> was not found on this server.</p>
        <p>This service uses the <strong>Twilio SMS API</strong> for 2FA authentication.</p>
        <p>Please check the URL or refer to our <a href="http://localhost:8080/api/v2/docs">API documentation</a> for available endpoints.</p>
    </div>
</body>
</html>
